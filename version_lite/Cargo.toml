[package]
name = "lite"
# The meta part must be in ASCII, so lib.rs can handle it.
#
version = "0.1.1+LITE"

edition = "2021"
# @TODO rust-version is set ONLY for
#
# - x.y.{1, 4, 7...}+LITE and
# - x.y.{2, 5, 8...}+FULL
#
# versions of `lite` crate itself.
#
# rust-version = "1.102.0"

readme = "../README.md"
license = "BSD-2-Clause OR Apache-2.0 OR MIT"

authors = ["Peter Lyons Kehl<peter.kehl@gmail.com>"]
description = "Helping libraries to have lightweight compile time-only versions. That speeds up development."

categories = ["no-std", "no-std::no-alloc", "rust-patterns"]
keywords = ["lightweight", "lite", "no-std", "no_std", "rust-patterns"]

repository = "https://github.com/flexsync-rs/lite"

# include = ["../src"]
include = ["../src/*"]

[lib]
path = "../src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "deny"}
unknown_lints = { level = "forbid"}

[dependencies]
# `no-link` is enabled here, and imported in src/lib.rs, only for `+LITE` versions, that
# is, ones with a "lite_on_nightly" feature.
#
# But, even if `no-link` would be listed here as a dependency regardless of the feature(s),
# consumers _would_ still link successfully if `no-link` were not imported in any Rust source file.
no-link = {version = "0.2.2", optional = true}

[features]
# "default_feature" exists only so that we detect whether (all the crates that use lite) have
# specified `default-features=false`, and hopefully they followed README.md.
default_feature = []
default = ["default_feature"]

# @TODO Only for versions x.y.1, x.y.4, x.y.7 etc.
lite_on_nightly = ["dep:no-link"]

# as per https://docs.rs/about/metadata
[package.metadata.docs.rs]
no-default-features = true
# @TODO Only for versions x.y.1, x.y.4, x.y.7 etc.
#
#features = ["lite_on_nightly"]
